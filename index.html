<!DOCTYPE html>
<html>
<head><title>Task Tracker</title></head>
<body style="font-family:Arial; max-width:500px; margin:40px auto;">
  <h1 id="title">Task Tracker</h1>
  <p>Served by container: <b id="host">{{ host }}</b></p>
  <input id="task-input" placeholder="Enter a task">
  <button id="add-btn">Add</button>
  <ul id="task-list"></ul>
<script>
async function load() {
  const res = await fetch("/api/tasks");
  const tasks = await res.json();
  const ul = document.getElementById("task-list");
  ul.innerHTML = "";
  tasks.forEach(t => { const li = document.createElement("li"); li.textContent = t.title; ul.appendChild(li); });
}
document.getElementById("add-btn").onclick = async () => {
  const input = document.getElementById("task-input");
  await fetch("/api/tasks", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({title: input.value})});
  input.value = ""; load();
};
load();
</script>
</body>
</html>
